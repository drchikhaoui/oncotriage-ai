name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verify Tailwind output.css is fresh
        run: |
          npm ci
          npm run build:css
          if [ -n "$(git status --porcelain app/static/css/output.css)" ]; then
            echo "::error::output.css is out of date. Run 'npm run build:css' locally and commit."
            git diff --stat app/static/css/output.css
            exit 1
          fi

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Run tests
        run: uv run pytest --tb=short -q
        env:
          ANTHROPIC_API_KEY: ""

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t oncotriage:${{ github.sha }} .
