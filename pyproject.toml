[project]
name = "oncotriage"
version = "0.1.0"
description = "AI-powered oncology symptom triage using CTCAE v5.0 and NCCN guidelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "anthropic>=0.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.1",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "google-genai>=2.2.0",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
    "cachetools>=7.1.1",
    "pytest-vcr>=1.0.2",
    "respx>=0.23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
